{{- if .Values.observability.grafanaDashboard.enabled -}}
{{- $dashboardNamespace := default .Release.Namespace .Values.observability.grafanaDashboard.namespace -}}
{{/*
  Which of these render data, verified against the live Prometheus rather than
  assumed:

  platform-health and resource-efficiency query only kube-state-metrics,
  cAdvisor and Longhorn. All present and populated — these work as soon as this
  is enabled.

  frontend-errors, backend-errors and testing-regressions query
  definitely_not_crosswords_* series, which nothing emits: the Rust server has
  no /metrics route and service.yaml never exposes the otel-metrics port. They
  stay dark until that ships.

  delivery is mixed. Its Kubernetes and CronJob panels work; its GitOps panels
  read gotk_* from the Flux controllers, which Prometheus could not scrape until
  nixlab febdedd96 (host-networked Prometheus was dropped by Flux's own
  NetworkPolicy). Those panels backfill from the point that landed, not before —
  there is no history to draw.
*/}}
{{- $dashboards := list
  (dict
    "name" "frontend-errors"
    "title" "Crosswords Frontend Error Rate"
    "uid" "crosswords-frontend-errors"
    "file" "frontend-errors.json"
    "folder" "Crosswords/Observability/Errors"
    "tags" "observability,errors,frontend"
  )
  (dict
    "name" "backend-errors"
    "title" "Crosswords Backend Error Rate"
    "uid" "crosswords-backend-errors"
    "file" "backend-errors.json"
    "folder" "Crosswords/Observability/Errors"
    "tags" "observability,errors,backend"
  )
  (dict
    "name" "testing-regressions"
    "title" "Crosswords Testing Regressions"
    "uid" "crosswords-testing-regressions"
    "file" "testing-regressions.json"
    "folder" "Crosswords/Testing/Suites"
    "tags" "testing,regressions"
  )
  (dict
    "name" "multiplayer"
    "title" "Crosswords Multiplayer Soak & Load"
    "uid" "crosswords-multiplayer"
    "file" "multiplayer.json"
    "folder" "Crosswords/Testing/Multiplayer"
    "tags" "testing,multiplayer,realtime"
  )
  (dict
    "name" "platform-health"
    "title" "Crosswords Platform Health"
    "uid" "crosswords-platform-health"
    "file" "platform-health.json"
    "folder" "Crosswords/Observability/Platform"
    "tags" "observability,platform,kubernetes"
  )
  (dict
    "name" "resource-efficiency"
    "title" "Crosswords Resource Efficiency"
    "uid" "crosswords-resource-efficiency"
    "file" "resource-efficiency.json"
    "folder" "Crosswords/Observability/Platform"
    "tags" "observability,platform,resources"
  )
  (dict
    "name" "delivery"
    "title" "Crosswords Delivery & GitOps"
    "uid" "crosswords-delivery"
    "file" "delivery.json"
    "folder" "Crosswords/Delivery/GitOps"
    "tags" "delivery,gitops,flux"
  )
-}}
{{- range $dashboards }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "definitely-not-crosswords.fullname" $ }}-grafana-dashboard-{{ .name }}
  namespace: {{ $dashboardNamespace }}
  labels:
    {{- include "definitely-not-crosswords.labels" $ | nindent 4 }}
    {{- with $.Values.observability.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    grafana_dashboard_name: {{ .name | quote }}
data:
  {{ .file }}: |
{{ $.Files.Get (printf "dashboards/%s" .file) | nindent 4 }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "definitely-not-crosswords.fullname" $ }}-{{ .name }}
  namespace: {{ $dashboardNamespace }}
  labels:
    {{- include "definitely-not-crosswords.labels" $ | nindent 4 }}
spec:
  {{- if $.Values.observability.grafanaDashboard.allowCrossNamespaceImport }}
  allowCrossNamespaceImport: true
  {{- end }}
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  # NESTED FOLDERS ARE OPT-IN and default to OFF.
  #
  # Each dashboard carries a tier like "Crosswords/Observability/Errors",
  # which renders as `folder: Crosswords/Observability/Errors`. A nested path
  # only works if this cluster's Grafana operator can CREATE the intermediate
  # folders — if it cannot, the GrafanaDashboard CR fails to apply and every
  # dashboard stops syncing at once, which reads as the entire dashboard set
  # regressing rather than as one bad resource.
  #
  # Operator capability is not verifiable from this repo, so the default
  # restores exactly what shipped before tiering: a single folder from values.
  # Enable with `nestedFolders: true` once the operator version is known good.
  {{- if $.Values.observability.grafanaDashboard.nestedFolders }}
  folder: {{ (.folder | default $.Values.observability.grafanaDashboard.folder) | quote }}
  {{- else }}
  folder: {{ $.Values.observability.grafanaDashboard.folder | quote }}
  {{- end }}
  uid: {{ .uid | quote }}
  {{- /* Tags ride the same opt-in as nested folders: the default must render
         byte-identically to what shipped before tiering existed, so a CRD that
         rejects either field is never handed one. */}}
  {{- $tagList := .tags | default "" }}
  {{- if and $.Values.observability.grafanaDashboard.nestedFolders $tagList }}
  tags: [{{ $i := 0 }}{{ range $t := splitList "," $tagList }}{{ if $i }}, {{ end }}{{ $t | quote }}{{ $i = add1 $i }}{{ end }}]
  {{- end }}
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  configMapRef:
    name: {{ include "definitely-not-crosswords.fullname" $ }}-grafana-dashboard-{{ .name }}
    key: {{ .file }}
{{- end }}
{{- end -}}
