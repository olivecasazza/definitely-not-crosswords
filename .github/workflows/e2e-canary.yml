name: e2e-canary

# Deterministic Playwright e2e against staging. One spec set, two purposes:
#   • smoke.spec.ts — the always-on canary (unauthenticated; no creds)
#   • demo.spec.ts  — authenticated golden path; its 1080p recording is published
#                     to the GitHub release as the demo video (needs E2E creds)
# Semantic locators keep it low-maintenance: a styling/layout refactor won't break
# it, only a real user-facing flow change will (which should page you).

on:
  schedule:
    - cron: "0 8 * * *" # nightly ~00:00 PT — canary against staging
  release:
    types: [published] # cut a release -> record + publish the demo video
  workflow_dispatch:
    inputs:
      prod_url:
        description: Production canary URL override for forced-failure verification
        required: false
        type: string
      prod_bundle_path:
        description: Production bundle path override for forced-failure verification
        required: false
        type: string

concurrency:
  group: e2e-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Playwright canary + demo capture
    runs-on: ubuntu-latest
    # Official image ships the browsers + system libs — no install/caching step.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    env:
      E2E_BASE_URL: https://crosswords-staging.casazza.io
      # Set these repo secrets to enable the authenticated demo (a staging test
      # account). Absent -> demo.spec.ts self-skips; the canary still runs.
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Optional second staging account for the co-op chapter (join/presence/
      # live letters between two different users). Absent -> the chapter falls
      # back to the primary account (live transport only, no presence chips).
      E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
      E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}
    steps:
      # Always test with main's specs. A `release` event checks out the TAG by
      # default, which replays weeks-old specs against today's staging — that's
      # what turned every release-triggered run red (the canary fixes only
      # existed on main). The specs describe the deployed site, not the tag.
      - uses: actions/checkout@v4
        with:
          ref: main
      # A release event fires when the GitHub release is cut — but staging only
      # updates minutes later (buildbot builds + pushes to GAR, then Flux's
      # ImagePolicy rolls it out). Gate on /api/config's version so the demo is
      # recorded against the release it claims to show. This is why the check
      # lives here and not in buildbot: buildbot's pipeline ends at the GAR
      # push; only the deployed app knows when Flux has actually applied it.
      - name: Wait for staging to serve the released version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # ##*v (longest match) survives both tag shapes: "v0.1.31" and
          # "crossword-server-v0.1.31" -> 0.1.31 ("#*v" would stop at the v in
          # "server" and leave "er-v0.1.31").
          want="${TAG##*v}"
          # 45m: a cold nix build of the server image (ort/onnx) runs 30m+
          # before GAR even sees the tag, then Flux needs a scan interval.
          for i in $(seq 1 135); do
            got=$(curl -sf "$E2E_BASE_URL/api/config" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            [ "$got" = "$want" ] && { echo "staging is on $got"; exit 0; }
            echo "staging on ${got:-unknown}, want $want — retry $i/135"
            sleep 20
          done
          echo "::error::staging never reached $want after 45m"; exit 1
      # Scheduled runs get a lighter gate: ride out a transient blip (pod
      # reschedule, tunnel reconnect) for up to 5 minutes before testing, but
      # still fail if staging is truly down — the nightly canary is the only
      # alarm that watches staging at all, so it must stay capable of ringing.
      - name: Wait for staging to answer at all
        if: github.event_name == 'schedule'
        run: |
          for i in $(seq 1 15); do
            curl -sf -o /dev/null "$E2E_BASE_URL/api/healthz" && { echo "staging healthy"; exit 0; }
            echo "staging not answering — retry $i/15"
            sleep 20
          done
          echo "::error::staging unreachable for 5m before the nightly run"; exit 1
      # DEF-152: a green Playwright run proves the browsers reached ONE PoP; it
      # does NOT prove the content-hashed bundle is 200 everywhere. A poisoned
      # edge entry (a cached 404) leaves `/` green while the front door is blank
      # for every visitor whose PoP holds the bad object. So before the specs,
      # probe the ACTUAL served artifact: parse the content-hash out of the live
      # index.html and require a 200 on that exact URL from THIS runner. A fresh
      # content-hash can never be a pre-existing cache HIT, so a poisoned entry
      # fails here the moment it appears, instead of looking healthy for hours.
      - name: Verify the served bundle artifact is 200 (not just `/`)
        run: |
          index="$(curl -fsS --max-time 30 "$E2E_BASE_URL/")"
          # Anchor on the hash's actual shape, not "whatever precedes .js".
          # The served shell carries the boot card's own CSS comment, which
          # documents a failure message with the literal text
          # `https://host/_assets/<64-hex>/crossword-web.js?r=<ms>` — and it sits
          # in <head>, ABOVE the real <script> tag. The old `/[^"]*/` pattern
          # matched that comment first, so the probe requested a URL that has
          # never existed and reported a 404 as a poisoned edge entry. The bundle
          # hash is `sha256sum | cut -c1-16` (client/flake.nix), i.e. exactly 16
          # lowercase hex chars, so match that and nothing else.
          glue="$(printf '%s' "$index" | grep -o '/_assets/[0-9a-f]\{16\}/crossword-web\.js' | head -1 || true)"
          if [ -z "$glue" ]; then
            echo "::error::no /_assets/<16-hex>/crossword-web.js in $E2E_BASE_URL/ — bundle layout changed; update this check"
            exit 1
          fi
          probe_artifact_url() {
            url="$1"
            samples="$2"
            label="$3"
            ok=0
            http_bad=0
            transport_bad=0
            codes=""
            transport_errors=""
            for i in $(seq 1 "$samples"); do
              err_file="$(mktemp)"
              rc=0
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$url" 2>"$err_file")" || rc=$?
              err="$(<"$err_file")"
              rm -f "$err_file"
              if [ "$rc" -ne 0 ] || [ "$code" = "000" ]; then
                transport_bad=$((transport_bad + 1))
                transport_errors="$transport_errors sample $i: curl exit $rc http $code${err:+ ($err)};"
                continue
              fi
              codes="$codes$code "
              if [ "$code" = "200" ]; then
                ok=$((ok + 1))
              else
                http_bad=$((http_bad + 1))
              fi
            done
            if [ "$http_bad" -gt 0 ]; then
              echo "::error::$label artifact $url returned HTTP non-200 in $http_bad/$samples completed samples [$codes] — possible poisoned edge cache entry / blank front door for those visitors"
              [ "$transport_bad" -gt 0 ] && echo "::warning::$label artifact $url also had transport errors in $transport_bad/$samples samples:$transport_errors"
              exit 1
            fi
            if [ "$ok" -eq 0 ]; then
              echo "::error::$label artifact $url had only transport errors in $transport_bad/$samples samples:$transport_errors"
              exit 1
            fi
            if [ "$transport_bad" -gt 0 ]; then
              echo "::warning::$label artifact $url had transport errors in $transport_bad/$samples samples after retries:$transport_errors"
            fi
            echo "ok  $url -> 200 on $ok/$samples completed samples"
          }
          wasm_url="$E2E_BASE_URL$(dirname "$glue")/crossword-web_bg.wasm"
          for url in "$E2E_BASE_URL$glue" "$wasm_url"; do
            probe_artifact_url "$url" 3 staging
          done
      - name: Install deps
        working-directory: e2e
        run: npm ci
      - name: Run e2e
        working-directory: e2e
        run: npx playwright test --reporter=list,html
      - name: Upload report + video + trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$DISCORD" ] && { echo "DISCORD_WEBHOOK unset; skipping alert"; exit 0; }
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"content\":\"🚨 crosswords staging e2e canary FAILED — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$DISCORD" || true

  multiplayer-soak:
    name: Four-player multiplayer soak
    runs-on: ubuntu-latest
    # Separate from `canary` for the same reason `production-artifact` is: the
    # soak needs four seeded accounts and a playable game, so it fails for
    # reasons that have nothing to do with whether the canary's login page
    # renders. Coupling them would mean a missing e2e secret suppresses the demo
    # recording AND the front-door canary.
    #
    # Runs on a schedule and on demand only — never on `release`. A release
    # fires minutes before Flux has rolled the new image out (see the version
    # gate in the `canary` job), so a four-client soak would race the rollout
    # and report contention against a half-rolled deployment.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    env:
      E2E_BASE_URL: https://crosswords-staging.casazza.io
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
      E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}
      E2E_EMAIL_3: ${{ secrets.E2E_EMAIL_3 }}
      E2E_PASSWORD_3: ${{ secrets.E2E_PASSWORD_3 }}
      E2E_EMAIL_4: ${{ secrets.E2E_EMAIL_4 }}
      E2E_PASSWORD_4: ${{ secrets.E2E_PASSWORD_4 }}
    steps:
      # main's specs, same reasoning as the canary job: a `schedule` event can
      # land on any ref, and the specs describe the deployed site.
      - uses: actions/checkout@v4
        with:
          ref: main
      # Unblock before the browsers start. This reconciles the four accounts
      # (signup is idempotent and needs no admin credential), picks the
      # in-progress game with the MOST open cells, and joins players 2-4. It
      # exits non-zero on a partial state on purpose: a soak that ran against
      # three accounts is not a four-player result.
      - name: Reconcile accounts and provision a playable game
        # Explicit bash, not GitHub's default. A `container:` job runs `run:`
        # under `sh -e`, which on this image is dash: `set -o pipefail` aborts
        # with "Illegal option" before the loop is ever entered, so this step
        # failed on every dispatch regardless of account state. The indirect
        # expansion `${!1:-}` below is a bashism too.
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v jq >/dev/null; then
            apt-get update
            apt-get install -y jq
          fi
          for pair in "E2E_EMAIL E2E_PASSWORD" "E2E_EMAIL_2 E2E_PASSWORD_2" \
                      "E2E_EMAIL_3 E2E_PASSWORD_3" "E2E_EMAIL_4 E2E_PASSWORD_4"; do
            set -- $pair
            if [ -z "${!1:-}" ] || [ -z "${!2:-}" ]; then
              echo "::error::$1/$2 not set as repo secrets — a four-player soak needs four distinct accounts."
              echo "Add them (see secrets.yaml.example) or this job cannot run. Not self-skipping:"
              echo "a green job that tested one player would read as a passing soak."
              exit 1
            fi
          done
          ./scripts/multiplayer-bot-admin.sh --apply | tee -a "$GITHUB_ENV"
      - name: Install deps
        working-directory: e2e
        run: npm ci
      - name: Run four-player soak
        id: soak
        working-directory: e2e
        # `if: always()` on the NEXT step, not here: this step must genuinely
        # fail the job on a red suite. The metrics step records the outcome
        # either way, so a failing soak still reaches the dashboard.
        run: |
          set +e
          started=$(date +%s)
          npx playwright test multiplayer-soak.spec.ts --reporter=list,html
          code=$?
          elapsed=$(( $(date +%s) - started ))
          case $code in
            0) status=pass ;;
            2) status=skip ;;
            *) status=fail ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "duration=$elapsed" >> "$GITHUB_OUTPUT"
          exit $code
      # The multiplayer dashboard queries
      # definitely_not_crosswords_ci_test_state{suite="multiplayer-soak"}. Nothing
      # in this repo emitted that series before this step, which is why the
      # dashboards were permanently empty. Runs on failure too: a red soak that
      # never records its own outcome is exactly the run you need to see.
      - name: Emit soak metrics
        if: always()
        run: |
          ./scripts/emit-test-metrics.sh \
            --suite multiplayer-soak \
            --status "${{ steps.soak.outputs.status || 'fail' }}" \
            --cases 1 \
            --duration "${{ steps.soak.outputs.duration || 0 }}" \
            -o soak-metrics.prom
          # Push only when a pushgateway exists; a missing scrape target must
          # not turn a metrics step into a red job.
          if [ -n "${PUSHGATEWAY_URL:-}" ]; then
            PUSHGATEWAY_URL="$PUSHGATEWAY_URL" \
              ./scripts/publish-test-metrics.sh soak-metrics.prom || \
              echo "::warning::pushgateway publish failed; metrics are in the artifact"
          fi
      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-soak-results
          path: |
            e2e/playwright-report
            e2e/test-results
            soak-metrics.prom
          retention-days: 14
      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$DISCORD" ] && { echo "DISCORD_WEBHOOK unset; skipping alert"; exit 0; }
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"content\":\"🚨 crosswords 4-player multiplayer soak FAILED — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$DISCORD" || true

  protocol-load:
    name: Multiplayer protocol load (k6)
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: multiplayer-soak`. The load test is what
    # quantifies the crossing-cell contention the soak can only observe once,
    # and gating one on the other means the number that matters is unavailable
    # exactly when the soak is already red. Both jobs reconcile their own state.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    env:
      E2E_BASE_URL: https://crosswords-staging.casazza.io
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
      E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}
      E2E_EMAIL_3: ${{ secrets.E2E_EMAIL_3 }}
      E2E_PASSWORD_3: ${{ secrets.E2E_PASSWORD_3 }}
      E2E_EMAIL_4: ${{ secrets.E2E_EMAIL_4 }}
      E2E_PASSWORD_4: ${{ secrets.E2E_PASSWORD_4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: cachix/cachix-action@v17
        env:
          USER: root
        with:
          name: nix-community
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # `nix run` rather than `nix build`: the load scenario needs a LIVE host,
      # so it can never be a `checks` derivation (the repo rule is that Nix
      # verification lives in checks and GHA keeps only non-Nix gates). The flake
      # supplies the pinned k6 + the scenario; the scenario needs the network.
      - name: Run k6 multiplayer load
        # Explicit bash: this is a `container:` job, so GitHub would run it
        # under `sh -e` and `set -o pipefail` below would abort with
        # "Illegal option" instead of enforcing the threshold.
        shell: bash
        run: |
          # stdout carries the Prometheus exposition format (handleSummary
          # returns it as `stdout`), so tee it to a file for the push step.
          # `set -o pipefail` so a threshold breach still fails the job: the
          # crossing-conflict threshold is the whole point of this gate.
          set -o pipefail
          nix run --accept-flake-config --impure \
            --option allow-import-from-derivation true \
            ./client#crossword-load -- run multiplayer.js \
            --env SOAK_DURATION="${SOAK_DURATION:-60s}" \
            2>&1 | tee k6-metrics.prom
      # The summary is also uploaded below. Push to the pushgateway only when
      # one is configured: this repo has no PUSHGATEWAY_URL today, and a
      # missing scrape target must not fail the job that produced the numbers.
      - name: Publish metrics to pushgateway
        if: env.PUSHGATEWAY_URL != ''
        run: |
          nix run --accept-flake-config --impure ./client#crossword-load -- version >/dev/null
          ./scripts/publish-test-metrics.sh k6-metrics.prom || \
            echo "::warning::pushgateway publish failed; metrics are still in the artifact"
      - name: Upload load summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-load-summary
          path: |
            load-summary.json
            k6-metrics.prom
          retention-days: 14
      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$DISCORD" ] && { echo "DISCORD_WEBHOOK unset; skipping alert"; exit 0; }
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"content\":\"🚨 crosswords multiplayer load FAILED (crossing-cell contention?) — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$DISCORD" || true

  production-artifact:
    name: Production served-artifact canary
    runs-on: ubuntu-latest
    # A SEPARATE job, not a step in `canary`, on purpose. The `canary` job
    # drives the Playwright suite and the demo recording; letting a production
    # alarm take that down would mean a blank front door also suppresses the
    # release video. Separate = both alarms stay independent, and `workflow_dispatch`
    # gives a one-command way to check production without touching staging.
    steps:
      # DEF-152 added an artifact probe, but bound it to $E2E_BASE_URL, which is
      # STAGING. So the one environment with real visitors was never probed —
      # and the failure we actually hit was invisible:
      #
      #   * staging served  /_assets/bf256d7687350f0b/...   200 on every sample
      #   * production served /_assets/11b0c85674a7cd1c/...  404 on 13/40 samples
      #
      # production was blank for those visitors while the staging canary stayed
      # green every night. Nothing in CI compares the two environments.
      #
      # The release machinery could not catch it either: production was 10
      # commits behind main and BOTH environments reported `"version":"0.1.49"`,
      # so the existing `/api/config` version gate was satisfied by a build that
      # did not contain the fix. The version string is the release identity, not
      # the content identity — only the content-hash URL tells you what is live.
      #
      # Runs on the same triggers as the rest of the canary.
      - name: Probe production's served bundle
        env:
          PROD_URL: ${{ inputs.prod_url || 'https://crosswords.casazza.io' }}
        # Explicit bash. This job has no `container:`, so GitHub already
        # defaults to bash and this step is not currently broken — but the two
        # steps below it are one `container:` line away from the same
        # "Illegal option -o pipefail" death as multiplayer-soak, and the
        # default flips silently with that line. Pinned, not implicit.
        shell: bash
        run: |
          set -uo pipefail
          index=""
          if [ -z "${{ inputs.prod_bundle_path }}" ]; then
            index="$(curl -fsS --max-time 30 "$PROD_URL/")" || {
              echo "::error::production index.html unreachable at $PROD_URL/"; exit 1; }
          fi
          # Same anchor as the staging probe, for the same reason: the boot
          # card's CSS comment in <head> names a `/_assets/<64-hex>/…` example
          # before the real <script> tag, and an unanchored match probes a URL
          # that never existed. That is how a green production probe became a
          # permanent red one the moment this build shipped.
          glue="${{ inputs.prod_bundle_path }}"
          if [ -z "$glue" ]; then
            glue="$(printf '%s' "$index" | grep -o '/_assets/[0-9a-f]\{16\}/crossword-web\.js' | head -1 || true)"
            if [ -z "$glue" ]; then
              echo "::error::no /_assets/<16-hex>/crossword-web.js in production index.html — bundle layout changed; update this check"
              exit 1
            fi
          fi
          # Sample repeatedly instead of once. A poisoned edge entry splits by
          # PoP (observed: 404 from SEA, 200 from PDX), so a single request is a
          # coin flip and would make this alarm useless. 10 samples from one
          # runner reliably catches a PoP split.
          probe_artifact_url() {
            url="$1"
            samples="$2"
            label="$3"
            ok=0
            http_bad=0
            transport_bad=0
            codes=""
            transport_errors=""
            for i in $(seq 1 "$samples"); do
              err_file="$(mktemp)"
              rc=0
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$url" 2>"$err_file")" || rc=$?
              err="$(<"$err_file")"
              rm -f "$err_file"
              if [ "$rc" -ne 0 ] || [ "$code" = "000" ]; then
                transport_bad=$((transport_bad + 1))
                transport_errors="$transport_errors sample $i: curl exit $rc http $code${err:+ ($err)};"
                continue
              fi
              codes="$codes$code "
              if [ "$code" = "200" ]; then
                ok=$((ok + 1))
              else
                http_bad=$((http_bad + 1))
              fi
            done
            if [ "$http_bad" -gt 0 ]; then
              echo "::error::$label artifact $url returned HTTP non-200 in $http_bad/$samples completed samples [$codes] — possible poisoned edge cache entry / blank front door for those visitors"
              [ "$transport_bad" -gt 0 ] && echo "::warning::$label artifact $url also had transport errors in $transport_bad/$samples samples:$transport_errors"
              exit 1
            fi
            if [ "$ok" -eq 0 ]; then
              echo "::error::$label artifact $url had only transport errors in $transport_bad/$samples samples:$transport_errors"
              exit 1
            fi
            if [ "$transport_bad" -gt 0 ]; then
              echo "::warning::$label artifact $url had transport errors in $transport_bad/$samples samples after retries:$transport_errors"
            fi
            echo "ok  $url -> 200 on $ok/$samples completed samples"
          }
          for url in "$PROD_URL$glue" "$PROD_URL$(dirname "$glue")/crossword-web_bg.wasm"; do
            probe_artifact_url "$url" 10 production
          done

      # The probe above says "is production blank right now". This says "can it
      # get blank again", and it is the check whose absence let the trap re-arm.
      #
      # The root cause (DEF-140/145/152/158) was that the origin stamped
      # `immutable, max-age=31536000` on its OWN 404s, so a transiently-missing
      # asset during a deploy became a 1-year pinned edge object. #122 fixed that
      # with CacheControlOnOkLayer — on main, and on staging, and NOT on
      # production. Measured against a never-before-requested hash:
      #
      #   staging    404 -> cache-control: max-age=14400                             (fixed)
      #   production 404 -> cache-control: public, max-age=31536000, immutable      (armed)
      #
      # A fresh random hash cannot be a cache HIT, so this reads the ORIGIN's
      # headers directly. If the `immutable` directive ever comes back on a
      # non-200, the trap is re-armed and this goes red before a visitor does.
      - name: Production origin must not cache 404s immutably
        env:
          PROD_URL: ${{ inputs.prod_url || 'https://crosswords.casazza.io' }}
        # Explicit bash, same reason as the probe above.
        shell: bash
        run: |
          set -uo pipefail
          probe="/_assets/$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')/crossword-web.js"
          hdrs="$(curl -sS -D - -o /dev/null --max-time 60 "$PROD_URL$probe" 2>&1 || true)"
          echo "probe: $PROD_URL$probe"
          printf '%s\n' "$hdrs" | grep -i -E '^(HTTP/|cache-control|cf-cache-status)' || true
          if printf '%s' "$hdrs" | grep -qi '^cache-control:.*immutable'; then
            echo "::error::production stamps 'immutable' on a 404 for a never-cached hash — a transient miss will be pinned at the edge for a year (DEF-152 criterion 3 is not live here)"
            exit 1
          fi
          echo "ok  production 404 carries no immutable directive — misses stay revalidatable"
      - name: Alert Discord on production artifact failure
        if: failure()
        env:
          DISCORD: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$DISCORD" ] && { echo "DISCORD_WEBHOOK unset; skipping alert"; exit 0; }
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"content\":\"🚨 crosswords PRODUCTION artifact canary FAILED — blank/poisoned front door or the origin re-armed immutable-on-404 — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$DISCORD" || true

  publish-demo:
    name: Publish demo video
    needs: canary
    # Publish on a real release (attach to that release) OR a manual run (attach
    # to the rolling `demo-latest` release for a stable view link).
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/upload the demo-latest release asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-results
          path: results
      - name: Convert demo recording to mp4
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # Playwright writes one webm per test under test-results/<test>/.
          # The co-op second player is recorded on an emulated phone; its video
          # lives under a phone/ subdir of the same test output dir.
          v=$(find results \( -path '*tour*' -o -path '*demo*' \) -name '*.webm' -not -path '*phone*' | head -1)
          if [ -z "$v" ]; then
            echo "No demo video (E2E_EMAIL/E2E_PASSWORD unset -> demo skipped)."; exit 0
          fi
          phone=$(find results -path '*phone*' -name '*.webm' | head -1)
          # yuv420p is load-bearing for Safari/Discord/Slack playback.
          if [ -n "$phone" ]; then
            # Split-screen dock: the main recording scaled onto a dark 1920x1080
            # canvas (the app's own bg color) at the left, and the second
            # player's phone docked at the right — nothing gets covered.
            # Output length follows the main recording; the phone freezes on
            # its last frame if its clip ends first.
            ffmpeg -y -i "$v" -i "$phone" -filter_complex \
              "[0:v]scale=1450:-2,pad=1920:1080:20:-1:color=0x121212[canvas];[1:v]scale=410:-2[phone];[canvas][phone]overlay=W-w-20:(H-h)/2:eof_action=repeat" \
              -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart demo.mp4
          else
            ffmpeg -y -i "$v" -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart demo.mp4
          fi
          echo "MP4=1" >> "$GITHUB_ENV"
      - name: Publish demo.mp4
        if: env.MP4 == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="demo-latest"
            gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || \
              gh release create "$TAG" -R "${{ github.repository }}" \
                --title "Latest e2e demo video" --notes "Auto-updated by the e2e-canary workflow." --prerelease
          fi
          gh release upload "$TAG" demo.mp4 --clobber -R "${{ github.repository }}"
          echo "Demo video: $GITHUB_SERVER_URL/${{ github.repository }}/releases/download/$TAG/demo.mp4"
          echo "### 🎬 Demo video published" >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/${{ github.repository }}/releases/download/$TAG/demo.mp4" >> "$GITHUB_STEP_SUMMARY"
