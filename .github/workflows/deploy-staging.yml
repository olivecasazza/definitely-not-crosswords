name: deploy-staging

# Continuous staging deploy. Flux's image-automation can't drive this repo (the
# cluster is one kubenix-generated single-line-JSON manifests.yaml; the $imagepolicy
# setter marker lives in a Nix comment Flux's YAML Setter never sees). So on a new
# release we bump the staging image tag in nixlab's crosswords.nix AND regenerate
# manifests.yaml right here — exactly what the local pre-commit hook does — then push
# both. Flux applies manifests.yaml. Self-contained: no dependency on nixlab's CI
# (their builds are Hydra + local pre-commit, not GitHub Actions). Prod stays pinned.
#
# Triggered AFTER the image build (CI/CD Pipeline) succeeds — never on the push
# itself — so staging is never pointed at an image not yet in the registry.
# Continuous: fires for every main-branch build (deploying that build's :<sha>
# image) as well as for release tags. Prod stays pinned either way.

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
  # Manual escape hatch: redeploy staging to an arbitrary already-built tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy to staging (e.g. v0.1.3)"
        required: true

# Serialize: never race two bumps against nixlab main.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Bump staging tag + regenerate manifests
    runs-on: ubuntu-latest
    # Successful image builds only: release tags (head_branch is the tag name,
    # e.g. v0.1.3) AND main-branch builds (continuous staging). PR builds don't
    # push images and don't match either arm.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (startsWith(github.event.workflow_run.head_branch, 'v') ||
        github.event.workflow_run.head_branch == 'main'))
    steps:
      # access-tokens lets nix fetch nixlab's private flake input
      # (github:olivecasazza/consortium-autoresearch). RELEASE_PLZ_TOKEN is an
      # olivecasazza classic PAT (it already pushes to nixlab), so it can read it.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Setup Nix caching
        uses: cachix/cachix-action@main
        with:
          name: nix-community
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Bump staging tag + regenerate manifests in nixlab
        env:
          # Manual dispatch supplies the tag; a release build's head_branch IS the
          # tag; a main build deploys its :<full-sha> image (pushed by CI on every
          # main push).
          TAG: ${{ github.event.inputs.tag || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha) || github.event.workflow_run.head_branch }}
          NIXLAB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "${NIXLAB_TOKEN:-}" ]; then
            echo "RELEASE_PLZ_TOKEN not set — skipping staging deploy."
            exit 0
          fi
          set -euo pipefail
          git clone "https://x-access-token:${NIXLAB_TOKEN}@github.com/casazza-info/nixlab.git" nixlab
          cd nixlab
          file=modules/k8s/apps/crosswords.nix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rewrite git@github.com:casazza-info/ SSH URLs to HTTPS with token so
          # nix build can fetch private flake inputs (e.g. inputs.agentctx) in CI.
          git config --global url."https://x-access-token:${NIXLAB_TOKEN}@github.com/casazza-info/".insteadOf "git@github.com:casazza-info/"

          # manifests.yaml is kubenix-generated and nixlab regenerates it on EVERY
          # change, so it must never take part in a rebase — the old
          # regenerate-then-rebase order put it in one and conflicted every single
          # run ("CONFLICT (content): modules/k8s/manifests.yaml"). Instead: start
          # from the current origin/main each attempt, apply the source edit,
          # regenerate the manifest from THAT tree, push. A lost race just retries
          # against the newer main rather than trying to merge generated output.
          for attempt in 1 2 3; do
            git fetch origin main -q
            git reset -q --hard origin/main
            # Rewrite only the line carrying the crosswords-staging $imagepolicy marker,
            # so the pinned prod tag (no marker) is never touched. The current value
            # may be a v-tag or a main-build sha — match anything quoted.
            sed -i -E 's|tag = "[^"]+"; # \{"\$imagepolicy": "apps:crosswords-staging"\}|tag = "'"$TAG"'"; # {"$imagepolicy": "apps:crosswords-staging"}|' "$file"
            if git diff --quiet -- "$file"; then
              echo "Staging already at $TAG — nothing to do."
              exit 0
            fi
            # Commit the tag bump first so `nix build` evaluates a clean tree at the
            # new tag (no dirty-tree ambiguity), then fold the regenerated manifest in.
            git commit -qm "chore(k8s): deploy crosswords staging to $TAG" -- "$file"
            nix build .#k8s-manifests
            cp -L result modules/k8s/manifests.yaml
            rm -f result
            git add modules/k8s/manifests.yaml
            git commit -q --amend --no-edit
            if git push origin HEAD:main; then
              echo "Bumped nixlab crosswords staging to $TAG (+ regenerated manifests)"
              exit 0
            fi
            echo "nixlab main moved under us; retrying from the new head ($attempt/3)"
          done
          echo "Could not land the staging bump after 3 attempts."; exit 1
