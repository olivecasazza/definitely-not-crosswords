# release-plz: this is a deployable app (Axum server + wasm + desktop), not a
# crates.io library — so no publish. The 8 workspace crates share one version
# (`version.workspace = true`), and we want ONE app version, ONE tag, ONE
# changelog and ONE GitHub release. Achieve that by disabling release artifacts
# for every crate by default and enabling them only on the deployable
# `crossword-server` crate (whose version is the app version).

[workspace]
publish = false
git_release_enable = false
git_tag_enable = false
changelog_update = false

[[package]]
name = "crossword-server"
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"
# release-plz scopes a package's changelog to commits touching that package's
# directory. crossword-server is the only crate with changelog_update, so
# without this every release only ever saw `backend/server/**` — frontend,
# build and infra work never appeared (v0.1.25 omitted the web cache-bust fix
# entirely). Pull the whole workspace into the one changelog we publish.
changelog_include = [
  "crossword-core",
  "crossword-web",
  "crossword-desktop",
  "crossword-db",
  "crossword-auth",
  "crossword-events",
  "crossword-tools",
]
