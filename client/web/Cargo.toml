[package]
name = "crossword-web"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
crossword-core = { path = "../core" }
dioxus = { version = "0.6", features = ["web", "router"] }
serde.workspace = true
serde_json.workspace = true
# Git dep, not a path dep. An absolute `/home/olive/...` path dep only resolves on
# olive's laptop; every other machine (CI, runner containers, contributors) fails
# at manifest load with "failed to read .../panel-kit/Cargo.toml". See DEF-244.
#
# Pinned to panel-kit main at 72b0510. web/src/workspace.rs depends on
# panel_kit::SnapPolicy, panel::panel_shell_with_events, the 4-arg
# widgets::dock(.., extras), panel_kit_core::reducer::ReduceContext.snap,
# input::tile_drag_pointer_event and input::use_tile_drag_frames. Cargo.lock
# holds the resolved revision; bump the `rev` and re-resolve the lock together.
panel-kit = { git = "https://github.com/ocasazza/panel-kit.git", rev = "72b0510a7b9dee1416d78555d87a313cc4127614" }
panel-kit-core = { git = "https://github.com/ocasazza/panel-kit.git", rev = "72b0510a7b9dee1416d78555d87a313cc4127614" }
gloo-storage = "0.3"
gloo-net = { version = "0.6", features = ["http", "websocket", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Location", "Document", "Element", "DomTokenList", "console",
  # Event/EventTarget: reset_password.rs registers a native submit listener,
  # because Dioxus 0.6 can't cancel a form's default action (see there).
  # net.rs registers the window online/offline listeners for the subscription
  # connection state machine, and reads `navigator.onLine` off Navigator.
  "Event", "EventTarget", "Navigator",
] }
# Pinned to the wasm-bindgen-cli nixpkgs ships (panel-kit's lock pins the same);
# dx refuses to bindgen against a mismatched CLI.
wasm-bindgen = "=0.2.121"
