[package]
name = "panel-kit"
version = "1.0.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6", features = ["web", "router"] }
gloo-storage = "0.3"
js-sys = "0.3"
panel-kit-core = { path = "crates/panel-kit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
