{{- if .Values.ingress.enabled -}}
{{- $fullName := include "definitely-not-crosswords.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "definitely-not-crosswords.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  # One port for everything — the Rust server serves HTTP, /api
                  # and the tRPC WebSocket on service.port. The old conditional
                  # sent "ws" paths to .Values.service.wsPort, which nothing has
                  # ever set, so `number:` rendered empty and BOTH environments'
                  # Helm upgrades failed on the /api/trpc-ws path with
                  # "port name or number is required".
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
