name: deploy-staging

# Continuous staging deploy. Flux's image-automation can't drive this repo (the
# cluster is one kubenix-generated single-line-JSON manifests.yaml; the $imagepolicy
# setter marker lives in a Nix comment Flux's YAML Setter never sees). So on a new
# release we bump the staging image tag in nixlab's crosswords.nix AND regenerate
# manifests.yaml right here — exactly what the local pre-commit hook does — then push
# both. Flux applies manifests.yaml. Self-contained: no dependency on nixlab's CI
# (their builds are Hydra + local pre-commit, not GitHub Actions). Prod stays pinned.
#
# Triggered AFTER the image build (CI/CD Pipeline) succeeds — never on the push
# itself — so staging is never pointed at an image not yet in the registry.
# Continuous: fires for every main-branch build (deploying that build's :<sha>
# image) as well as for release tags. Prod stays pinned either way.

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
  # Manual escape hatch: redeploy staging to an arbitrary already-built tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy to staging (e.g. v0.1.3)"
        required: true

# Serialize: never race two bumps against nixlab main.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Bump staging tag + regenerate manifests
    runs-on: ubuntu-latest
    # Successful image builds only: release tags (head_branch is the tag name,
    # e.g. v0.1.3) AND main-branch builds (continuous staging). PR builds don't
    # push images and don't match either arm.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (startsWith(github.event.workflow_run.head_branch, 'v') ||
        github.event.workflow_run.head_branch == 'main'))
    steps:
      # access-tokens lets nix fetch nixlab's private flake input
      # (github:olivecasazza/consortium-autoresearch). RELEASE_PLZ_TOKEN is an
      # olivecasazza classic PAT (it already pushes to nixlab), so it can read it.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Setup Nix caching
        uses: cachix/cachix-action@v17
        with:
          name: nix-community
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Bump staging tag + regenerate manifests in nixlab
        env:
          # Manual dispatch supplies the tag; a release build's head_branch IS the
          # tag; a main build deploys its :<full-sha> image (pushed by CI on every
          # main push).
          TAG: ${{ github.event.inputs.tag || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha) || github.event.workflow_run.head_branch }}
          NIXLAB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          # A deploy that never ran must NOT report as a successful deploy.
          # This branch used to `exit 0`, which is how a deploy could be green
          # while the endpoint served 502 — nothing downstream could tell the
          # difference between "deployed" and "did nothing" (DEF-110).
          if [ -z "${NIXLAB_TOKEN:-}" ]; then
            echo "::error::RELEASE_PLZ_TOKEN not set — cannot deploy staging. Failing loudly instead of reporting a deploy that never happened."
            exit 1
          fi
          set -euo pipefail
          git clone "https://x-access-token:${NIXLAB_TOKEN}@github.com/casazza-info/nixlab.git" nixlab
          cd nixlab
          file=modules/k8s/apps/crosswords.nix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rewrite git@github.com:casazza-info/ SSH URLs to HTTPS with token so
          # nix build can fetch private flake inputs (e.g. inputs.agentctx) in CI.
          git config --global url."https://x-access-token:${NIXLAB_TOKEN}@github.com/casazza-info/".insteadOf "git@github.com:casazza-info/"

          # manifests.yaml is kubenix-generated and nixlab regenerates it on EVERY
          # change, so it must never take part in a rebase — the old
          # regenerate-then-rebase order put it in one and conflicted every single
          # run ("CONFLICT (content): modules/k8s/manifests.yaml"). Instead: start
          # from the current origin/main each attempt, apply the source edit,
          # regenerate the manifest from THAT tree, push. A lost race just retries
          # against the newer main rather than trying to merge generated output.
          for attempt in 1 2 3; do
            git fetch origin main -q
            git reset -q --hard origin/main
            # Rewrite only the line carrying the crosswords-staging $imagepolicy marker,
            # so the pinned prod tag (no marker) is never touched. The current value
            # may be a v-tag or a main-build sha — match anything quoted.
            sed -i -E 's|tag = "[^"]+"; *# \{"\$imagepolicy": "apps:crosswords-staging"\}|tag = "'"$TAG"'"; # {"$imagepolicy": "apps:crosswords-staging"}|' "$file"
            if git diff --quiet -- "$file"; then
              echo "Staging already at $TAG — nothing to do."
              exit 0
            fi
            # Commit the tag bump first so `nix build` evaluates a clean tree at the
            # new tag (no dirty-tree ambiguity), then fold the regenerated manifest in.
            git commit -qm "chore(k8s): deploy crosswords staging to $TAG" -- "$file"
            # Rewrite SSH URLs for agentctx (private repo, olivecasazza org) to HTTPS
            # with token auth (DEF-64/DEF-66/DEF-78). The colon form (git@github.com:)
            # is caught by the global rewrite above; add the ssh:// form here too.
            git config --global url."https://x-access-token:${NIXLAB_TOKEN}@github.com/olivecasazza/".insteadOf "git@github.com:olivecasazza/"
            git config --global url."https://x-access-token:${NIXLAB_TOKEN}@github.com/olivecasazza/".insteadOf "ssh://git@github.com/olivecasazza/"
            nix build .#k8s-manifests
            cp -L result modules/k8s/manifests.yaml
            rm -f result
            git add modules/k8s/manifests.yaml
            git commit -q --amend --no-edit
            if git push origin HEAD:main; then
              echo "Bumped nixlab crosswords staging to $TAG (+ regenerated manifests)"
              exit 0
            fi
            echo "nixlab main moved under us; retrying from the new head ($attempt/3)"
          done
          echo "Could not land the staging bump after 3 attempts."; exit 1

      # Post-deploy readiness probe. The bump step above only proves the image tag
      # landed in nixlab's crosswords.nix. Flux applies it asynchronously, and a bad
      # image — or a cluster-level fault like the CNPG/Longhorn outage — serves 502
      # while this run is still green. A green `deploy-staging` was therefore not a
      # health signal, and short-circuiting an incident verification to "the run went
      # green" validated a dead service (DEF-110).
      #
      # This step runs on every success path, including the benign
      # "already at $TAG - nothing to do" no-op (that `exit 0` ends the *step*, not
      # the job), so a green run always means "and it is actually answering".
      #
      # No `set -e` here on purpose: curl failing is the retry condition, not a
      # reason to abandon the poll. Failure is reported explicitly at the bottom.
      - name: Verify staging is actually serving
        env:
          BASE_URL: https://crosswords-staging.casazza.io
          TAG: ${{ github.event.inputs.tag || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha) || github.event.workflow_run.head_branch }}
          # The budget is a variable, not a literal, so the log line and the loop
          # can never disagree about it again. See POLL_BUDGET below.
          POLL_INTERVAL: 20
          POLL_BUDGET: 90
        run: |
          set -uo pipefail
          # POLL_BUDGET polls x POLL_INTERVAL seconds.
          #
          # This was 30, and 30 was not enough here either: run 36528799397
          # (v0.1.65) burned all 30 polls and exited 1 "did not come up on
          # v0.1.65" while staging was mid-rollout, and the observed rollouts
          # that did finish needed 12-25 polls. Same arithmetic error as the
          # production probe, and the same "~18m" comment for a 10-minute bound.
          # 90 x 20s = 30 minutes: 3x the worst rollout observed (25 polls), with
          # room for Flux's image-policy scan plus a large image pull.
          for i in $(seq 1 "$POLL_BUDGET"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE_URL/api/healthz" 2>/dev/null) || code=000
            if [ "$code" = "200" ]; then
              cfg=$(curl -s --max-time 15 "$BASE_URL/api/config" 2>/dev/null) || cfg=""
              # A release/tag deploy must be serving exactly that version. Continuous
              # staging deploys a :<sha> image while /api/config reports the crate
              # version, so only assert the version when the tag is a version tag.
              #
              # A version MISMATCH is a retry condition, not a verdict — same bug
              # the production probe had. The previous pod answers 200 for the
              # whole rolling update, so the first poll lands on the old build and
              # the loop bailed after ~1s of its 18m budget. A tag deploy that
              # then completed correctly was reported red. Retry the version
              # exactly the way the health check is retried.
              case "$TAG" in
                *v[0-9]*)
                  got=$(printf '%s' "$cfg" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
                  want="${TAG##*v}"
                  if [ "$got" != "$want" ]; then
                    echo "healthz=200 from $BASE_URL but serving ${got:-unknown}, want $want — the previous pod is still up, rolling out — retry $i/$POLL_BUDGET"
                    sleep "$POLL_INTERVAL"
                    continue
                  fi
                  echo "serving expected version $got"
                  ;;
                *)
                  echo "tag $TAG is not a version tag; skipping the version assertion"
                  ;;
              esac
              echo "healthz=200 from $BASE_URL; /api/config -> ${cfg:-<empty>}"
              echo "::notice::Post-deploy readiness OK: $BASE_URL is serving."
              exit 0
            fi
            echo "healthz=$code from $BASE_URL — retry $i/$POLL_BUDGET"
            sleep "$POLL_INTERVAL"
          done
          echo "::error::$BASE_URL did not come up on $TAG within $POLL_BUDGET polls (~$((POLL_BUDGET * POLL_INTERVAL / 60))m). The tag bump to nixlab succeeded but the service is not serving it. Do NOT treat this run as a healthy deploy — triage the cluster/app before closing the incident."
          exit 1
