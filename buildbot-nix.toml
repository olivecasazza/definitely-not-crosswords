# buildbot-nix per-repo configuration.
# See https://github.com/nix-community/buildbot-nix/blob/main/docs/EFFECTS.md
#
# This repo is enrolled in buildbot via the GitHub App + `nixlab-ci` topic
# (configured on the buildbot master in the casazza-hydra repo). buildbot
# evaluates `.#checks` on every PR and reports commit status to GitHub,
# replacing the conventional-commits / approval-check / auto-merge GHA jobs.
#
# On `v*` tag pushes (cut by release-plz), the worker builds `.#dockerImage`
# itself and the postBuildStep `push-to-gar` (defined in casazza-hydra's
# modules/nixos/buildbot.nix) pushes the OCI archive to Google Artifact
# Registry via skopeo. Flux's ImagePolicy then promotes the new tag to
# staging automatically — no deploy-staging GHA workflow needed.

# Branches/refs that run postBuildSteps (the GAR push). Tag pushes matching
# this glob trigger the release pipeline.
effects_branches = ["v*"]
