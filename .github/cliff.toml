# git-cliff config for the release-notes step in release-plz.yml.
#
# Why this exists: release-plz can't work out where the previous release ended
# for this repo (crates are publish = false, so there's no registry package, and
# the Cargo workspace lives in client/ while .git is one level up, which also
# rules out git_only). It therefore hands git-cliff every commit in the repo and
# every release re-published the same block. Verified against release-plz
# 0.3.159: worktree / full-clone / shallow-clone baselines via
# --registry-manifest-path, a crossword-server-v* tag, git_only, and a
# tag_pattern changelog config all produce the identical full-history dump.
#
# git-cliff run directly over `<prev-tag>..<new-tag>` has no such problem, so
# the workflow generates the notes that way. Groups match the sections
# release-plz was writing, so CHANGELOG.md stays consistent with its history.

[changelog]
header = ""
body = """
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Release commits are bookkeeping, not changes anyone reads notes for.
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^doc", group = "Documentation" },
  { message = ".*", group = "Other" },
]
