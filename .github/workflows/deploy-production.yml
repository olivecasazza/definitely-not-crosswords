name: deploy-production

# Production deploy. Triggered when a release tag (v*) is pushed to main, or
# manually via workflow_dispatch. Mirrors deploy-staging.yml but targets the
# production image policy marker in nixlab's crosswords.nix.
#
# Unlike staging (which deploys every main-branch SHA continuously), production
# only promotes release-tag builds. The production marker in crosswords.nix is
# the stable/pinned tag; this workflow bumps it to the release tag on each promotion.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy to production (e.g. v0.1.3)"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Bump production tag + regenerate manifests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Setup Nix caching
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Bump production tag + regenerate manifests in nixlab
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          NIXLAB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          # A deploy that never ran must NOT report as a successful deploy.
          # This branch used to `exit 0`, which is how a deploy could be green
          # while the endpoint served 502 — nothing downstream could tell the
          # difference between "deployed" and "did nothing" (DEF-110).
          if [ -z "${NIXLAB_TOKEN:-}" ]; then
            echo "::error::RELEASE_PLZ_TOKEN not set — cannot deploy production. Failing loudly instead of reporting a deploy that never happened."
            exit 1
          fi
          set -euo pipefail
          git clone "https://x-access-token:${NIXLAB_TOKEN}@github.com/casazza-info/nixlab.git" nixlab
          cd nixlab
          file=modules/k8s/apps/crosswords.nix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global url."https://x-access-token:${NIXLAB_TOKEN}@github.com/casazza-info/".insteadOf "git@github.com:casazza-info/"

          for attempt in 1 2 3; do
            git fetch origin main -q
            git reset -q --hard origin/main
            # Rewrite only the line carrying the crosswords-prod $imagepolicy marker.
            # The marker is required: an optional marker also matched the staging
            # tag line and overwrote it on every production deploy. ` *#` normalizes
            # to the single space nixfmt expects (nixlab Format Check).
            sed -i -E 's|tag = "[^"]+"; *# \{"\$imagepolicy": "apps:crosswords-prod"\}|tag = "'"$TAG"'"; # {"$imagepolicy": "apps:crosswords-prod"}|' "$file"
            if git diff --quiet -- "$file"; then
              echo "Production already at $TAG — nothing to do."
              exit 0
            fi
            git commit -qm "chore(k8s): deploy crosswords production to $TAG" -- "$file"
            git config --global url."https://x-access-token:${NIXLAB_TOKEN}@github.com/olivecasazza/".insteadOf "git@github.com:olivecasazza/"
            git config --global url."https://x-access-token:${NIXLAB_TOKEN}@github.com/olivecasazza/".insteadOf "ssh://git@github.com/olivecasazza/"
              # DEF-364: nixlab STILL declares a top-level `agentctx` input
            # (git+ssh://git@github.com/olivecasazza/agentctx.git, flake.nix:110)
            # whose repo 404s, so Nix resolving every direct input before
            # evaluating any output kills `nix build .#k8s-manifests` in
            # call-flake.nix — the manifest can't regenerate even though the
            # k8s path never consumes agentctx (only home-manager modules do).
            # The override removal in #276 ("dropped in nixlab#560") checked out
            # against a nixlab main that still declares it — v0.1.113, v0.1.114
            # and v0.1.115 all failed to deploy on this exact fetch since.
            #
            # Override the dead input with a tiny local stub. `--override-input`
            # is transient (it never rewrites nixlab's flake.lock) and the stub
            # is never evaluated on the k8s-manifests path, so the generated
            # manifest is byte-for-byte what the real input would have produced.
            # Root-cause cleanup is to drop agentctx from nixlab for real.
            agentctx_stub="$RUNNER_TEMP/agentctx-stub"
            mkdir -p "$agentctx_stub"
            printf '%s\n' \
              '{' \
              '  description = "Stub for the deleted olivecasazza/agentctx flake input (DEF-364).";' \
              '  outputs = { self }: {' \
              '    homeManagerModules.default = { };' \
              '    lib.renderPi = _: { };' \
              '  };' \
              '}' > "$agentctx_stub/flake.nix"
            nix build .#k8s-manifests --override-input agentctx "path:$agentctx_stub"
            cp -L result modules/k8s/manifests.yaml
            rm -f result
            git add modules/k8s/manifests.yaml
            git commit -q --amend --no-edit
            if git push origin HEAD:main; then
              echo "Bumped nixlab crosswords production to $TAG (+ regenerated manifests)"
              exit 0
            fi
            echo "nixlab main moved under us; retrying from the new head ($attempt/3)"
          done
          echo "Could not land the production bump after 3 attempts."; exit 1

      # Post-deploy readiness probe. The bump step above only proves the image tag
      # landed in nixlab's crosswords.nix. Flux applies it asynchronously, and a bad
      # image — or a cluster-level fault like the CNPG/Longhorn outage — serves 502
      # while this run is still green. A green `deploy-production` was therefore not a
      # health signal, and short-circuiting an incident verification to "the run went
      # green" validated a dead service (DEF-110).
      #
      # This step runs on every success path, including the benign
      # "already at $TAG - nothing to do" no-op (that `exit 0` ends the *step*, not
      # the job), so a green run always means "and it is actually answering".
      #
      # No `set -e` here on purpose: curl failing is the retry condition, not a
      # reason to abandon the poll. Failure is reported explicitly at the bottom.
      - name: Verify production is actually serving
        env:
          BASE_URL: https://crosswords.casazza.io
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          # DEF-317: the COMMIT the deployed tag names, so the gate can assert
          # buildSha on a `v*` tag. On a tag push `github.sha` IS the tagged
          # commit (release-plz cuts the tag on the release commit); on a manual
          # dispatch it is the sha of whatever ref the workflow ran on, so the
          # tag is resolved through the API below instead. Passed as an env var
          # rather than `git rev-parse` because neither deploy workflow checks
          # the repository out — there is no git tree on the runner to ask.
          COMMIT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          # The budget is a variable, not a literal, so the log line and the loop
          # can never disagree about it again. See POLL_BUDGET below.
          POLL_INTERVAL: 20
          POLL_BUDGET: 90
        run: |
          set -uo pipefail
          # POLL_BUDGET polls x POLL_INTERVAL seconds.
          #
          # This was 30, and 30 was not enough. Every observed rollout of a
          # production release tag needed 12-25 polls (4-8.5m) to swap pods, and
          # the six consecutive releases v0.1.60..v0.1.65 all burned the full 30
          # and exited 1 "did not come up on $TAG" (run 36540600801) while the
          # service was in fact mid-rollout and went on to serve the new version
          # minutes later. A deploy that lands is reported as a failed deploy, so
          # nobody can tell a real outage from a slow rollout by reading the run.
          # The comment above this loop used to claim "~18m" for those 30 polls;
          # 30 x 20s is 10 minutes, and the log said "retry i/30" while the
          # comment described a bound the code did not have.
          #
          # 90 x 20s = 30 minutes, 3x the worst rollout ever observed (25 polls)
          # and enough headroom for Flux's image-policy scan plus a large image
          # pull. Deliberately generous: the cost of a false negative is an
          # incident triaged against a healthy deploy, and the cost of a true
          # negative is 30 minutes of runner time.
          for i in $(seq 1 "$POLL_BUDGET"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE_URL/api/healthz" 2>/dev/null) || code=000
            if [ "$code" = "200" ]; then
              cfg=$(curl -s --max-time 15 "$BASE_URL/api/config" 2>/dev/null) || cfg=""
              # A release/tag deploy must be serving exactly that version. Continuous
              # staging deploys a :<sha> image while /api/config reports the crate
              # version, so a version tag is asserted against "version" and a :<sha>
              # tag against "buildSha" — both are assertions, neither is a skip.
              #
              # The sha arm exists because skipping it made a green run meaningless.
              # Production is v-tag-only in normal operation, so this arm is only
              # reachable via workflow_dispatch with a non-version tag — but a
              # workflow_dispatch is exactly how a bad build gets promoted by hand,
              # and with the arm skipped this step degenerated to "healthz == 200",
              # which a SURVIVING PRE-FIX POD returns perfectly well for the whole
              # rolling update. That is the DEF-124 shape on the host where a stale
              # build is worst. buildSha is the first 12 chars of the git rev
              # (client/flake.nix), so it is comparable to the tag.
              #
              # A MISMATCH on either arm is a retry condition, not a verdict — same
              # bug the production probe had. The previous pod answers 200 for the
              # whole rolling update, so the first poll lands on the old build and
              # the loop bailed after ~1s of its 18m budget. A tag deploy that
              # then completed correctly was reported red. Retry exactly the way
              # the health check is retried.
              # DEF-317: BOTH arms assert buildSha, and the version arm asserts
              # version too. The `v*` arm used to check `version` only, which is
              # why run 37173764985 went green against `"buildSha":"unknown"`:
              # the crate version is correct even in an image whose provenance
              # is unknown, so `version` matching proved nothing about WHICH
              # build was serving. On PRODUCTION that is the assertion that must
              # not be allowed to pass silently — a release nobody can name is a
              # rollback nobody can reason about.
              #
              # `version` is also the crate version, identical across every image
              # built from that commit, so it cannot distinguish this build from
              # any other build of the same version. buildSha is
              # `builtins.substring 0 12` of the commit and is the only field
              # that can.
              version_ok=1
              build_sha_ok=1
              case "$TAG" in
                *v[0-9]*)
                  got=$(printf '%s' "$cfg" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
                  want="${TAG##*v}"
                  if [ "$got" != "$want" ]; then
                    version_ok=0
                    echo "healthz=200 from $BASE_URL but serving version ${got:-<none>}, want $want — the previous pod is still up, rolling out — retry $i/$POLL_BUDGET"
                  fi
                  ;;
              esac
              # buildSha is `builtins.substring 0 12` of the COMMIT. A `v*` tag
              # names a version, not a commit, so "${TAG:0:12}" would be
              # "v0.1.101" — which no buildSha can ever equal. Resolve the tag to
              # its commit first:
              #   * on a tag push, the commit IS the tag (release-plz cuts the tag
              #     ON the release commit; measured: v0.1.101 ->
              #     28f7bfb6ba955c2703c9c75f9ac37152fb83bedd), delivered as
              #     COMMIT_SHA above;
              #   * for a `:latest`/`:<sha>` image, the sha is literally the tag.
              #
              # If the commit cannot be resolved the gate FAILS rather than
              # skipping: an unverifiable release is not a green release, and
              # that skip is exactly how run 37173764985 went green.
              got=$(printf '%s' "$cfg" | grep -o '"buildSha":"[^"]*"' | cut -d'"' -f4)
              commit=""
              case "$TAG" in
                *v[0-9]*)
                  commit="$COMMIT_SHA"
                  if [ -z "$commit" ]; then
                    build_sha_ok=0
                    echo "::error::cannot resolve $TAG to a commit, so buildSha cannot be asserted — refusing to report a green deploy for an unverifiable release (DEF-317)"
                    want=""
                  else
                    want="${commit:0:12}"
                  fi
                  ;;
                *)
                  want="${TAG:0:12}"
                  ;;
              esac
              if [ "$build_sha_ok" -eq 1 ] && { [ -z "$got" ] || [ "$got" = "unknown" ]; }; then
                build_sha_ok=0
                echo "::error::healthz=200 from $BASE_URL but /api/config reports buildSha ${got:-<none>} — an image with no build identity is live on PRODUCTION. DEF-317 threaded the root flake's rev into BUILD_SHA so this cannot happen; if it does, the image was built from something other than this commit."
              elif [ "$got" != "$want" ]; then
                build_sha_ok=0
                echo "healthz=200 from $BASE_URL but serving build $got, want $want — the previous pod is still up, rolling out — retry $i/$POLL_BUDGET"
              fi
              if [ "$version_ok" -eq 0 ] || [ "$build_sha_ok" -eq 0 ]; then
                sleep "$POLL_INTERVAL"
                continue
              fi
              echo "serving expected version ${TAG##*v} and build $got"
              echo "healthz=200 from $BASE_URL; /api/config -> ${cfg:-<empty>}"
              echo "::notice::Post-deploy readiness OK: $BASE_URL is serving."
              exit 0
            fi
            echo "healthz=$code from $BASE_URL — retry $i/$POLL_BUDGET"
            sleep "$POLL_INTERVAL"
          done
          echo "::error::$BASE_URL did not come up on $TAG within $POLL_BUDGET polls (~$((POLL_BUDGET * POLL_INTERVAL / 60))m). The tag bump to nixlab succeeded but the service is not serving it. Do NOT treat this run as a healthy deploy — triage the cluster/app before closing the incident."
          exit 1
