name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # release tags (from release-plz) → push the versioned image
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
    branches: [ main ]
  pull_request_review:
    types: [ submitted ]
  # Manual build of a ref, and the escape hatch the auto-merge job needs: a
  # GITHUB_TOKEN merge emits no `push` event, so that job dispatches this
  # instead. workflow_dispatch is GitHub's documented exception to the
  # "token-triggered events create no run" rule.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Google OIDC Workload Identity Federation

env:
  GAR_LOCATION: us-central1
  GAR_REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: casazza-identity
  REPOSITORY: nixlab
  IMAGE: definitely-not-crosswords
  WIF_PROVIDER: projects/943444128204/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  WIF_SERVICE_ACCOUNT: crosswords-ci@casazza-identity.iam.gserviceaccount.com

jobs:
  # Build and migration gates run on buildbot-nix (flake `checks`: the
  # deliverables, dockerImage and `migrations`), which reports GitHub
  # statuses; GitHub Actions runs no Nix builds for PRs.
  #
  # FOLLOW-UP: build-and-push still builds the image with Nix here. Per the
  # CI policy it should publish Hydra's `hydraJobs.dockerImage` output.
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so this job re-lists
    # what its steps actually use and adds `actions: write` for the deploy
    # dispatch below. Narrower than the workflow default (no `pull-requests`,
    # no `contents: write`) — this job only needs to read the tree.
    permissions:
      contents: read   # actions/checkout
      id-token: write  # Google OIDC Workload Identity Federation
      actions: write   # gh workflow run deploy-staging.yml (see below)
    # push: every main/tag push. workflow_dispatch: the build the auto-merge
    # job dispatches, because a GITHUB_TOKEN squash-merge to main produces no
    # push event and would otherwise never be built (see that job).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: cachix/cachix-action@v17
        with:
          name: nix-community
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Authenticate to Google Cloud via OIDC Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Build the layered image with nix and load it into the local docker daemon.
      - name: Build image (nix)
        run: |
          IMAGE_TAR=$(nix build --option allow-import-from-derivation true --no-link --print-out-paths .#dockerImage)
          docker load < "$IMAGE_TAR"

      - name: Tag and push
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          BASE="${GAR_REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${IMAGE}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Release tag (from release-plz) → publish the versioned image. Flux's
            # semver ImagePolicy promotes this to the cluster.
            VERSION="${GITHUB_REF#refs/tags/}"
            docker tag "${BASE}:latest" "${BASE}:${VERSION}"
            docker push "${BASE}:${VERSION}"
            echo "pushed ${BASE}:${VERSION}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            # Continuous build on main: keep :latest + :sha (current deploy tracks
            # :latest until the ImagePolicy is flipped to semver).
            docker tag "${BASE}:latest" "${BASE}:${GITHUB_SHA}"
            docker push "${BASE}:${GITHUB_SHA}"
            docker push "${BASE}:latest"
            echo "pushed ${BASE}:latest + :${GITHUB_SHA}"
          fi

      # For a normal main/tag push, deploy-staging is triggered by its
      # `workflow_run` on this workflow's successful completion. It does NOT
      # follow a `workflow_dispatch` run of ci.yaml: #109's auto-merge dispatch
      # (run 36281055501, main, success at 2026-09-27T00:06:55Z) created no
      # deploy-staging run at all, while the PR-branch run that completed two
      # seconds earlier (36281036930) did. So the dispatched build — the only
      # kind an auto-merged PR ever produces — was built and never deployed.
      #
      # Dispatch it here, after `docker push` returns, which is the only point
      # where the :<sha> image is guaranteed to be in the registry. Firing it
      # any earlier would point staging at a tag that doesn't exist yet and take
      # the cluster to 502.
      #
      # Idempotent and safe to overlap with a `workflow_run`-triggered deploy:
      # deploy-staging serialises on its concurrency group and a repeat of the
      # same tag exits early on "Staging already at $TAG".
      - name: Deploy staging to the image just pushed
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-staging.yml \
            -R "${{ github.repository }}" --ref main \
            -f tag="${GITHUB_SHA}"
          echo "Dispatched a staging deploy of ${GITHUB_SHA}."

  # Every `#[test]` in the workspace was an unexecuted assertion: no job in any
  # workflow invoked cargo, so the 77 natively-runnable tests (23 in
  # core/db/auth/events, 54 in the server) had never been run by any pipeline.
  # The flake already defined a `cargo-test` check, but nothing executed it —
  # see the note on `build-and-push` about GitHub Actions running no Nix builds,
  # and note that the buildbot-nix enrolment described in buildbot-nix.toml is
  # not reporting statuses, so these checks have no other runner.
  #
  # The wasm crate's 23 tests are excluded on purpose: `crossword-web` needs
  # wasm-bindgen-test in a browser, which no runner here provides.
  #
  # This runs the two `cargo-test*` checks from the client flake rather than a
  # bare `cargo test`, so the suite is built by the same pinned, reproducible
  # toolchain as the image — including the vendored onnxruntime the server needs
  # to link at all, which a plain `cargo test` on a stock runner cannot do.
  rust-test:
    name: Rust Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
    # pull_request_review is listed because `auto-merge` fires on it and waits on
    # this job (see its `needs`). Without the event here, a review would skip
    # this job and the merge would be gated on a result that never came — a
    # permanently-pending `needs` entry blocks the dependent job for good.
    # It costs one cached Nix test build per review; the gate is worth it.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: cachix/cachix-action@v17
        with:
          name: nix-community
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `cargo-test` covers the four bare-sandbox crates; `cargo-test-server`
      # covers the backend, which is the half that needs onnxruntime. Building
      # the check runs the tests — crane's cargoTest executes them, and a
      # non-zero test result fails the build.
      - name: Run the workspace test suite
        run: |
          nix build --option allow-import-from-derivation true --no-link --print-out-paths \
            ./client#checks.x86_64-linux.cargo-test \
            ./client#checks.x86_64-linux.cargo-test-server

  conventional-commits-check:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    outputs:
      is_major: ${{ steps.check_commits.outputs.is_major }}
    steps:
      - name: Check commits for breaking changes
        id: check_commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list -R ${{ github.repository }} --search "${{ github.sha }}" --json number --jq '.[0].number')
          fi

          echo "PR Number: $PR_NUMBER"

          # Breaking change: "type!:" prefix or "BREAKING CHANGE(S)" in the body.
          # Note: the API can return a null commit message (release-plz's commit
          # on the release PR does) — `. // ""` keeps jq's test() from dying on it.
          has_breaking=$(gh pr view $PR_NUMBER -R ${{ github.repository }} --json commits --jq '[.commits[].message | . // "" | select(test("^[a-zA-Z]+!:") or contains("BREAKING CHANGE") or contains("BREAKING CHANGES"))] | length > 0')

          if [ "$has_breaking" = "true" ]; then
            echo "is_major=true" >> $GITHUB_OUTPUT
            echo "🚨 BREAKING CHANGE (Major Version Change) detected in PR commits!"
          else
            echo "is_major=false" >> $GITHUB_OUTPUT
            echo "✅ Only Minor/Patch commits detected."
          fi

  approval-check:
    name: Dynamic Approval Check
    runs-on: ubuntu-latest
    needs: conventional-commits-check
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    steps:
      - name: Verify Review Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_MAJOR: ${{ needs.conventional-commits-check.outputs.is_major }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list -R ${{ github.repository }} --search "${{ github.sha }}" --json number --jq '.[0].number')
          fi

          if [ "$IS_MAJOR" = "true" ]; then
            approvals=$(gh pr view $PR_NUMBER -R ${{ github.repository }} --json reviews --jq '[.reviews[] | select(.state == "APPROVED")] | length')
            if [ "$approvals" -eq 0 ]; then
              echo "❌ Major version change requires at least one APPROVED review to merge!"
              exit 1
            else
              echo "✅ Major version change has $approvals approved reviews."
            fi
          else
            echo "✅ Minor/Patch version change. Approved review is not required."
          fi

  auto-merge:
    name: Auto-Merge Minor/Patch PR
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, and an omitted scope
    # is `none` — so this job must re-list what the merge uses and add
    # `actions: write` for the `gh workflow run` below.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # `rust-test` is in `needs` because a test job nothing waits on is advice,
    # not a gate. This job is the thing that actually lands commits: it calls
    # `gh pr merge --auto`, and `main` has no branch protection
    # (`GET /branches/main/protection` → 404), so there are no required status
    # checks for auto-merge to wait on and it merges on the first green signal
    # GitHub offers. Without `rust-test` here, a red suite merges silently.
    needs: [ conventional-commits-check, approval-check, rust-test ]
    if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && needs.conventional-commits-check.outputs.is_major == 'false'
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list -R ${{ github.repository }} --search "${{ github.sha }}" --json number --jq '.[0].number')
          fi
          # Needs the repo's "Allow auto-merge" setting. It was off, so this step
          # red-X'd every PR while the code itself was green. Don't fail CI over a
          # repo setting — report it and move on; the PR is still mergeable by hand.
          if gh pr merge "$PR_NUMBER" -R ${{ github.repository }} --auto --squash; then
            echo "✅ Auto-merge enabled for PR #$PR_NUMBER (squash)."
          else
            echo "::warning::Could not enable auto-merge for PR #$PR_NUMBER — check that"
            echo "::warning::Settings → General → 'Allow auto-merge' is enabled. Merge manually."
          fi

      # The merge above authenticates as GITHUB_TOKEN, and GitHub creates no
      # workflow run for events triggered by the repository token — so the
      # squash landing on main emits no `push` event, `build-and-push` (which
      # only ran on push) never fires, and `deploy-staging` — keyed off a
      # main-branch push run — skips as well. Net effect: an auto-merged PR is
      # merged and never built, so staging silently serves stale code.
      # workflow_dispatch is the documented exception, so dispatch the main
      # build ourselves. Poll is bounded and exits early the moment the squash
      # lands; a hand-merged PR (PAT) still arrives here as a normal push.
      #
      # Dispatching the build is only half the chain. deploy-staging's
      # `workflow_run` trigger does not follow a dispatched ci.yaml run, so
      # `build-and-push` hands off to deploy-staging itself once the image is
      # pushed — see its "Deploy staging to the image just pushed" step.
      - name: Build main once the auto-merge lands
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list -R ${{ github.repository }} --search "${{ github.sha }}" --json number --jq '.[0].number')
          fi

          STATE=UNKNOWN
          for _ in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" -R ${{ github.repository }} --json state --jq .state)
            if [ "$STATE" = "MERGED" ] || [ "$STATE" = "CLOSED" ]; then
              break
            fi
            sleep 20
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "::notice::PR #$PR_NUMBER is $STATE, not merged — nothing to build."
            exit 0
          fi

          gh workflow run ci.yaml -R ${{ github.repository }} --ref main
          echo "Dispatched a main build of $(gh api repos/${{ github.repository }}/commits/main --jq .sha)."

      # The same trap swallows the entire release, in BOTH directions.
      #
      # `release-plz.yml` triggers only on `push` to main, and this job's merge
      # authenticates as GITHUB_TOKEN, so an auto-merge emits no push event and
      # release-plz never runs. That breaks two things:
      #
      #   1. It never OPENS a release PR. Measured: the last push-triggered run
      #      to main was 2026-09-17; all 20 commits after it landed via
      #      auto-merge, so release-plz never ran once and no release PR exists
      #      for them. The backlog is invisible to it.
      #   2. When a release PR does merge, it never CUTS the tag — the reported
      #      v0.1.49 failure. The next release-plz run only refreshes an open
      #      release PR; it does not go back and tag a version that already
      #      merged, so the release is swallowed until a human hand-dispatches
      #      (which is how v0.1.50 got its tag).
      #
      # workflow_dispatch is the documented exception to "token-triggered events
      # create no run", and the step above already relies on it to build main. So
      # dispatch release-plz here too, on EVERY auto-merge — the same shape as
      # the ci.yaml dispatch, because the same reasoning applies to both. Gating
      # this to release-PR merges only (an earlier attempt) looks like a cheap
      # optimisation, but it is inert: if release-plz never runs, no release PR
      # ever appears, so the gate never matches and nothing is ever tagged.
      #
      # Cost is not the deciding factor here: the step above already dispatches
      # ci.yaml, which runs a full Nix docker build, on every auto-merge. The
      # panel-kit clone plus Rust install release-plz does is the smaller half
      # of work this job already accepts, and an unshipped release is worse
      # than an idle runner.
      #
      # With this, the loop is self-sustaining and needs no PAT push:
      #   any auto-merge -> release-plz opens/updates the release PR
      #     -> that PR auto-merges -> release-plz cuts the tag + GitHub release
      #       -> the tag's PAT push builds the versioned image Flux promotes.
      - name: Keep the release pipeline running after the auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-plz.yml -R ${{ github.repository }} --ref main
          echo "Dispatched release-plz after this merge: it opens/updates the"
          echo "release PR, and cuts the tag when that PR merges."
